<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page Not Found - duziy</title>
        <link
            rel="icon"
            href="{{ url_for('static', filename='favicon.ico') }}"
            type="image/x-icon"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Courier New", monospace;
            }
            body {
                background: #000;
                color: #fff;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            #background {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                z-index: 1;
                pointer-events: none;
            }
            .error-container {
                position: relative;
                z-index: 20;
                text-align: center;
                background: rgba(0, 0, 0, 0.7);
                padding: 40px;
                border-radius: 15px;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            h1 {
                font-size: 48px;
                margin-bottom: 20px;
                color: #ff6b6b;
            }
            p {
                font-size: 18px;
                margin-bottom: 30px;
                color: rgba(255, 255, 255, 0.8);
            }
            .home-btn {
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.3);
                color: #fff;
                padding: 12px 24px;
                text-decoration: none;
                border-radius: 25px;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                transition: all 0.3s;
            }
            .home-btn:hover {
                background: rgba(255, 255, 255, 0.2);
                transform: scale(1.05);
            }
        </style>
    </head>
    <body>
        <video id="background" autoplay loop muted playsinline>
            <source
                src="{{ url_for('static', filename='backgrounds/background.mp4') }}"
                type="video/mp4"
            />
        </video>

        <div class="error-container">
            <h1><i class="fas fa-search"></i> 404</h1>
            <p>Page not found!</p>
            <p>The page you're looking for doesn't exist.</p>
            <a href="/" class="home-btn">
                <i class="fas fa-home"></i> Go Home
            </a>
        </div>
    </body>
</html>

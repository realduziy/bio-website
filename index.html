<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>duziy Profile</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <source src="/assets/background.mp4" type="video/mp4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        .custom-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            background: url('/assets/custom_cursor.png') no-repeat center center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            display: none;
        }

        body:not(.touch-device) {
            cursor: none;
        }

        body:not(.touch-device) .custom-cursor {
            display: block;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            min-height: auto;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
            pointer-events: auto;
            text-align: center;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .profile-container {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .profile-picture {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        #profile-name {
            font-family: 'Angel Wish', sans-serif;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #fff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            opacity: 1 !important;
        }

        #profile-bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            line-height: 1.4;
            opacity: 1 !important;
            min-height: 24px;
            width: 100%;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            pointer-events: auto;
            opacity: 1 !important;
            flex-wrap: wrap;
        }

        .icon-button {
            position: relative;
            text-decoration: none;
            color: white;
            font-size: 2rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            backdrop-filter: blur(3px);
        }

        .icon-button:hover {
            transform: scale(1.1);
        }

        .icon-button img,
        .fab-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .media-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            color: white;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            cursor: pointer;
        }

        #start-text {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #fff;
            text-align: center;
        }

        /* Orbit animations */
        @keyframes orbit {
            0% {
                transform: rotate(0deg) translateX(10px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(10px) rotate(-360deg);
            }
        }

        @keyframes fast-orbit {
            0% {
                transform: rotate(0deg) translateX(15px) rotate(0deg);
            }
            100% {
                transform: rotate(720deg) translateX(15px) rotate(-720deg);
            }
        }

        .profile-container.orbit {
            animation: orbit 10s linear infinite;
        }

        .profile-container.fast-orbit {
            animation: fast-orbit 0.5s linear;
        }

        @media (max-width: 430px) {
            #profile-block {
                width: 85vw;
                max-width: 300px;
                padding: 20px;
            }

            .profile-container {
                width: 80px;
                height: 80px;
            }

            .profile-picture {
                width: 80px;
                height: 80px;
            }

            #profile-name {
                font-size: 24px;
                letter-spacing: 2px;
            }

            #profile-bio {
                font-size: 14px;
                min-height: 21px;
            }

            .social-links {
                gap: 12px;
            }

            .icon-button {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }

            .icon-button img,
            .fab-icon {
                width: 24px;
                height: 24px;
            }
            
            #start-text {
                font-size: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
